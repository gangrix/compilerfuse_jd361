[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gangrix-compilerfuse_jd361"
version = "0.1.0"
description = "在同一个输入里两两比对，检测编译器与算子融合专家·长工具链的上下文回收相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "gangrix" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://gangrix.github.io"
Repository = "https://github.com/gangrix/compilerfuse_jd361"
Issues = "https://github.com/gangrix/compilerfuse_jd361/issues"

[project.scripts]
compilerfuse_jd361 = "compilerfuse_jd361:main"

[tool.setuptools]
py-modules = ["compilerfuse_jd361"]
